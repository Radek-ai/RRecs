[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recs"
version = "0.1.0"
description = "Modular, extensible recommendation systems library"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]
benchmark = ["matplotlib", "openpyxl"]

[tool.setuptools.packages.find]
where = ["src"]
